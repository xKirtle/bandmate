name: Bug report
description: Something in Bandmate doesn't work the way it should.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If it's a security problem, don't file it here: report it privately instead (see [SECURITY.md](https://github.com/xKirtle/bandmate/blob/main/SECURITY.md)).
  - type: textarea
    id: version
    attributes:
      label: Bandmate details
      description: Paste the block from Bandmate's About page → Copy details. If you can't reach the About page, give the version or commit instead, for example `v0.4.0` or `1a2b3c4`. The image tag `latest` or `edge` alone isn't enough, since they move to newer builds.
      placeholder: |
        Bandmate v0.4.0 (1a2b3c4, 2026-09-29)
        Go 1.25.1 linux/amd64 · SQLite 3.50.4 · schema 0027_track_volume_range
        Browser: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0
      render: text
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: The browser and its version, and the operating system it runs on.
      placeholder: Firefox 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: deployment
    attributes:
      label: How it's deployed
      description: How you run Bandmate (Docker, Docker Compose, the binary), and which reverse proxy it's behind, if any.
      placeholder: Docker Compose behind Caddy, with authentication at the proxy.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to do, step by step, to make the bug happen.
      placeholder: |
        1. Open a Song
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Include any error messages, server logs or screenshots.
    validations:
      required: true
