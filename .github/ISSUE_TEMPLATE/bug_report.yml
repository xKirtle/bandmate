name: Bug report
description: Something in Bandmate doesn't work the way it should.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If it's a security problem, don't file it here: report it privately instead (see [SECURITY.md](https://github.com/xKirtle/bandmate/blob/main/SECURITY.md)).
  - type: textarea
    id: version
    attributes:
      label: Bandmate details
      description: Paste the block from Bandmate's Settings → About → Copy details. If you can't reach About, give the version or commit instead, for example `v0.9.0` or `1a2b3c4`, and the browser and operating system you use it on. The image tag `latest` or `edge` alone isn't enough, since they move to newer builds.
      placeholder: |
        Bandmate v0.9.0 (1a2b3c4, 2026-10-06)
        Go 1.27.0 linux/amd64 · SQLite 3.50.4 · schema 0037_tags · yt-dlp 2026.08.19
        Browser: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0
      render: text
    validations:
      required: true
  - type: textarea
    id: deployment
    attributes:
      label: How it's deployed
      description: How you run Bandmate (Docker, Docker Compose, the binary), and which reverse proxy it's behind, if any.
      placeholder: Docker Compose behind Caddy, with authentication at the proxy.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to do, step by step, to make the bug happen.
      placeholder: |
        1. Open a Song
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Include any error messages, server logs or screenshots.
    validations:
      required: true
