# Groups the auto-generated notes of a GitHub release by the labels on its
# pull requests. The rule for which labels a pull request gets lives in
# CONTRIBUTING.md's "Label it".
changelog:
  exclude:
    labels: [no-release-notes]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Other
      labels: ["*"]
