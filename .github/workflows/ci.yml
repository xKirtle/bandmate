name: CI

# Pull requests only test, and check the image's bundled programs run. A push
# to main only publishes the image as `:edge` and `:sha-<short>`: main's
# ruleset requires a pull request to be up to date and to pass `test`,
# `bundle` and `e2e` before it merges, so what lands is what they checked. A `v*`
# version tag (e.g. `v0.4.0`) tests and checks again, then publishes a
# release as `:0.4.0`, `:0.4` and `:latest`, so `latest` is the newest
# release, never the latest merge. Changes to main or a PR that only touch
# docs or other files outside the build skip every job.
#
# The weekly yt-dlp job starts a run on the branch of each pull request it
# opens, since a pull request opened with GITHUB_TOKEN doesn't start one.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer run on the same PR replaces an older one. Runs on main and on tags
# are never cancelled, so every merged commit that changes code gets its
# image, and every release is published.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/xkirtle/bandmate

jobs:
  # Whether anything the build or tests read has changed. The workflow itself
  # always runs, so the required `test`, `bundle` and `e2e` checks always report: skipped counts
  # as passing, while a check that never starts leaves the PR waiting.
  # A tag has no previous commit to diff against, and a release must be
  # tested whatever changed, so a tag always counts as a code change. So does
  # a run started by hand or by the yt-dlp job: it was started to test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request runs on a merge of it into the current base branch, so
      # its first parent is that base. The PR's base.sha can lag behind it,
      # which would count changes merged to main since as the PR's own.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$([ "$GITHUB_EVENT_NAME" = pull_request ] && echo "$GITHUB_SHA^1" || echo "$BEFORE")
          if git diff --name-only "$base" "$GITHUB_SHA" -- \
              cmd internal web e2e docs/screenshots/demo.bandmate go.mod go.sum Dockerfile .dockerignore .github/workflows \
              ':!*.md' | grep -q .; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # Not on a push to main, whose pull request ran it on the same tree.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check the SPA's formatting
        working-directory: web
        run: npm run format:check

      - name: Lint the SPA's styles
        working-directory: web
        run: npm run lint:css

      - name: Type-check the SPA
        working-directory: web
        run: npm run check

      - name: Unit-test the SPA
        working-directory: web
        run: npm test

      # The Go binary embeds web/dist, so build it before the Go steps.
      - name: Build the SPA
        working-directory: web
        run: npm run build

      # Caches the module and build caches, keyed on go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The About page's list of Go modules and their licenses is committed,
      # so a plain go build has it. It goes stale when go.mod changes.
      - name: Check the Go license manifest is up to date
        run: |
          go generate ./internal/build
          if ! git diff --quiet -- internal/build/go-modules.json; then
            git diff -- internal/build/go-modules.json
            echo "::error file=internal/build/go-modules.json::The Go license manifest is stale. Run 'go generate ./internal/build' and commit internal/build/go-modules.json."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # The end-to-end suite in e2e/: Chromium driving the built web app against
  # a real Bandmate per worker. A test that fails is retried once. When the
  # job fails, the failed tests' traces are uploaded, to open with `npx
  # playwright show-trace`. Not on a push to main, like `test`.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install the suite's dependencies
        working-directory: e2e
        run: npm ci

      - name: Type-check the suite
        working-directory: e2e
        run: npm run check

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Builds the web app, then the Bandmate each worker starts, then runs
      # the suite.
      - name: Run the end-to-end suite
        working-directory: e2e
        run: npm test

      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

  # Builds the image and runs the programs bundled in it (ADR 0016), so a
  # broken bundle, such as a yt-dlp that won't start, fails the build rather
  # than a user's fetch. Then checks the image starts and passes its
  # healthcheck. Not on a push to main, like `test`.
  bundle:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      # From the Git context, like the image job, and loaded into Docker
      # rather than pushed. The image job reuses the programs' layers it
      # caches, which are the slow ones to build.
      - uses: docker/build-push-action@v7
        with:
          load: true
          tags: bandmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run yt-dlp, ffmpeg and QuickJS in the image
        run: |
          # Each assignment fails the step when its program fails.
          run() { docker run --rm --entrypoint "/usr/local/bin/$1" bandmate:ci "${@:2}"; }
          yt_dlp=$(run yt-dlp --version)
          ffmpeg=$(run ffmpeg -hide_banner -version)
          ffprobe=$(run ffprobe -hide_banner -version)
          quickjs=$(run qjs -e 'console.log("QuickJS runs")')
          echo "yt-dlp $yt_dlp"
          echo "${ffmpeg%%$'\n'*}"
          echo "${ffprobe%%$'\n'*}"
          echo "$quickjs"

      # yt-dlp finds ffmpeg and QuickJS on its own: its verbose header names
      # them. The made-up link fails without reaching the network.
      - name: Check yt-dlp finds ffmpeg and QuickJS
        run: |
          header=$(docker run --rm --entrypoint /usr/local/bin/yt-dlp bandmate:ci \
            --verbose --ignore-config --js-runtimes quickjs --simulate https://bundle-check.invalid/ 2>&1 || true)
          grep '^\[debug\] \(exe versions\|JS runtimes\)' <<< "$header" || true
          if ! grep -q '^\[debug\] exe versions: ffmpeg .*ffprobe' <<< "$header"; then
            echo "::error::yt-dlp doesn't find the bundled ffmpeg and ffprobe."
            exit 1
          fi
          if ! grep -q '^\[debug\] JS runtimes: quickjs' <<< "$header"; then
            echo "::error::yt-dlp doesn't find the bundled QuickJS."
            exit 1
          fi

      # The healthcheck's own command, checked every 2 seconds instead of 30.
      - name: Check the image starts healthy
        run: |
          docker run -d --name bandmate --health-interval 2s bandmate:ci
          for _ in $(seq 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' bandmate)
            if [ "$status" = healthy ]; then
              echo "The image started healthy."
              exit 0
            fi
            sleep 2
          done
          docker logs bandmate
          echo "::error::The image didn't become healthy (last status: $status)."
          exit 1

  # Only on pushes to main and version tags that change code: pull requests
  # have the bundle job's build instead. A Dockerfile problem those miss only
  # fails a publish, leaving the last good image in place (for a tag, that
  # version goes unpublished until the tag is pushed again). On main it runs
  # alone, `test`, `bundle` and `e2e` having passed on the pull request; on a
  # tag, only once all three pass again. `!cancelled()` keeps it from being
  # skipped with them on main.
  image:
    needs: [changes, test, bundle, e2e]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.changes.outputs.code == 'true' &&
      (github.ref_type == 'branch' ||
        (needs.test.result == 'success' && needs.bundle.result == 'success' && needs.e2e.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      # Tags a version tag vX.Y.Z as X.Y.Z, X.Y and latest (latest=auto adds
      # it to semver tags, but not to pre-releases), and the default branch,
      # main, as edge and sha-<short>. Also makes the OCI labels, among them
      # version (the first of those tags: X.Y.Z or edge), source (which links
      # the GHCR package to this repository) and revision.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge
            type=sha,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds from the Git context, so no checkout is needed. Layers
      # (including npm ci and go mod download) are cached in the GitHub
      # Actions cache. The build args stamp the binary with the version the
      # About page shows: the release tag on tag builds only, the commit, and
      # this repository, so a fork's image links to the fork's own source.
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
