name: CI

# Pull requests only test. A push to main tests again, then publishes the
# image as `:edge` and `:sha-<short>`. A `v*` version tag (e.g. `v0.4.0`)
# tests, then publishes a release as `:0.4.0`, `:0.4` and `:latest`, so
# `latest` is the newest release, never the latest merge. Changes to main or a
# PR that only touch docs or other files outside the build skip both jobs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer run on the same PR replaces an older one. Runs on main and on tags
# are never cancelled, so every merged commit that changes code gets its
# image, and every release is published.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/xkirtle/bandmate

jobs:
  # Whether anything the build or tests read has changed. The workflow itself
  # always runs, so the required `test` check always reports: skipped counts
  # as passing, while a check that never starts leaves the PR waiting.
  # A tag has no previous commit to diff against, and a release must be
  # tested whatever changed, so a tag always counts as a code change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request runs on a merge of it into the current base branch, so
      # its first parent is that base. The PR's base.sha can lag behind it,
      # which would count changes merged to main since as the PR's own.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$([ "$GITHUB_EVENT_NAME" = pull_request ] && echo "$GITHUB_SHA^1" || echo "$BEFORE")
          if git diff --name-only "$base" "$GITHUB_SHA" -- \
              cmd internal web go.mod go.sum Dockerfile .dockerignore .github/workflows \
              ':!*.md' | grep -q .; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check the SPA's formatting
        working-directory: web
        run: npm run format:check

      - name: Type-check the SPA
        working-directory: web
        run: npm run check

      - name: Unit-test the SPA
        working-directory: web
        run: npm test

      # The Go binary embeds web/dist, so build it before the Go steps.
      - name: Build the SPA
        working-directory: web
        run: npm run build

      # Caches the module and build caches, keyed on go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # Only on pushes to main and version tags: building the image on pull
  # requests mostly repeats the test job's builds, and a Dockerfile problem it
  # misses only fails a publish, leaving the last good image in place (for a
  # tag, that version goes unpublished until the tag is pushed again).
  # Skipped with `test`, and never runs when it fails.
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      # Tags a version tag vX.Y.Z as X.Y.Z, X.Y and latest (latest=auto adds
      # it to semver tags, but not to pre-releases), and the default branch,
      # main, as edge and sha-<short>. Also makes the OCI labels, among them
      # version (the first of those tags: X.Y.Z or edge), source (which links
      # the GHCR package to this repository) and revision.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge
            type=sha,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds from the Git context, so no checkout is needed. Layers
      # (including npm ci and go mod download) are cached in the GitHub
      # Actions cache. The build args stamp the binary with the version the
      # About page shows: the release tag on tag builds only, the commit, and
      # this repository, so a fork's image links to the fork's own source.
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
