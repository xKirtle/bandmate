name: CI

# Pull requests test every change to code; pushes to main test again, then
# build and publish the image. Changes that only touch docs or other files
# outside the build skip both.
on:
  push:
    branches: [main]
  pull_request:

# A newer run on the same branch or PR replaces an older one. Runs on main
# are never cancelled, so every merged commit that changes code gets its
# SHA-tagged image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/xkirtle/bandmate

jobs:
  # Whether anything the build or tests read has changed. The workflow itself
  # always runs, so the required `test` check always reports: skipped counts
  # as passing, while a check that never starts leaves the PR waiting.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request runs on a merge of it into the current base branch, so
      # its first parent is that base. The PR's base.sha can lag behind it,
      # which would count changes merged to main since as the PR's own.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=$([ "$GITHUB_EVENT_NAME" = pull_request ] && echo "$GITHUB_SHA^1" || echo "$BEFORE")
          if git diff --name-only "$base" "$GITHUB_SHA" -- \
              cmd internal web go.mod go.sum Dockerfile .dockerignore .github/workflows \
              ':!*.md' | grep -q .; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check the SPA
        working-directory: web
        run: npm run check

      - name: Unit-test the SPA
        working-directory: web
        run: npm test

      # The Go binary embeds web/dist, so build it before the Go steps.
      - name: Build the SPA
        working-directory: web
        run: npm run build

      # Caches the module and build caches, keyed on go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # Only on main: building the image on pull requests mostly repeats the
  # test job's builds, and a Dockerfile problem it misses only fails a
  # publish, leaving the last good image in place. Skipped with `test`.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds from the Git context, so no checkout is needed. Layers
      # (including npm ci and go mod download) are cached in the GitHub
      # Actions cache.
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
