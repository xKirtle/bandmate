name: Docs

# Builds the docs site in docs/web/ with VitePress. A pull request that touches it
# only builds it, which fails on a dead link. A `v*` version tag deploys it to
# GitHub Pages, so the site describes the latest release, never unreleased
# main; a run started by hand deploys too, to republish without a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - docs/web/**
      - docs/screenshots/*.png
      - docs/screenshots/*.webp
      - web/public/favicon.svg
      - .github/workflows/docs.yml
  workflow_dispatch:

# One deploy at a time, and a newer one never cancels a deploy under way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install
        working-directory: docs/web
        run: npm ci

      - name: Build the site
        working-directory: docs/web
        run: npm run build

      # A page that fails to render still builds, as an empty shell the
      # browser has to fill in, so a link straight to it shows nothing.
      - name: Check every page has its content
        working-directory: docs/web/.vitepress/dist
        run: |
          if grep -l '<div id="app"><!----></div>' *.html; then
            echo "::error::Those pages were built empty: rendering them failed. The build step's log says why."
            exit 1
          fi

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web/.vitepress/dist

  # Pages must be set to deploy from GitHub Actions, in the repository's
  # Settings → Pages.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
