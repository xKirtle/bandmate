services:
  bandmate:
    image: ${BANDMATE_IMAGE:-ghcr.io/xkirtle/bandmate:latest}
    container_name: bandmate
    restart: unless-stopped
    # The user that owns ./data, so Bandmate can write to it.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BANDMATE_PORT:-8080}:8080"
    environment:
      # The largest audio file Bandmate takes, in megabytes.
      BANDMATE_MAX_UPLOAD_MB: ${BANDMATE_MAX_UPLOAD_MB:-500}
      # "off" stops it checking GitHub for new versions of itself and of yt-dlp.
      BANDMATE_UPDATE_CHECK: ${BANDMATE_UPDATE_CHECK:-on}
      # "off" turns off downloading Beats from links.
      BANDMATE_ADD_FROM_LINK: ${BANDMATE_ADD_FROM_LINK:-on}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/bandmate", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
