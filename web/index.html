<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16161a" />
    <title>Bandmate</title>
    <script>
      // Shows the Palette and Light or Dark kept on this device from the first
      // paint, so the page never flashes the default. It reads them as
      // src/lib/appearance.ts does, which keeps them in step from then on.
      (function () {
        var palette, theme;
        try {
          palette = localStorage.getItem('bandmate.palette');
          theme = localStorage.getItem('bandmate.theme');
        } catch (e) {
          // No storage, e.g. blocked: Terracotta, following the system.
        }
        var root = document.documentElement;
        if (palette === 'ink' || palette === 'olive') root.dataset.palette = palette;
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
