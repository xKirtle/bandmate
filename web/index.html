<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bandmate</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Shows the Palette, Light or Dark and Track Colours kept on this device
      // from the first paint, so the page never flashes the default. It reads them as
      // src/lib/appearance.ts does, which keeps them in step from then on.
      (function () {
        var palette, theme, trackColours;
        try {
          palette = localStorage.getItem('bandmate.palette');
          theme = localStorage.getItem('bandmate.theme');
          trackColours = localStorage.getItem('bandmate.trackColours');
        } catch (e) {
          // No storage, e.g. blocked: Terracotta, following the system, with Track Colours.
        }
        var root = document.documentElement;
        if (palette === 'ink' || palette === 'olive') root.dataset.palette = palette;
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.dataset.theme = theme;
        if (trackColours === 'off') root.dataset.trackColours = 'off';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
